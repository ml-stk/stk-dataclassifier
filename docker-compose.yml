version: '3.8'

services:
  stk-classifier-api:
    build: .
    container_name: stk_data_classifier_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://stk_admin:stk_secure_pass@postgres:5432/stk_classifier_db
    depends_on:
      - postgres
    networks:
      - stk-net

  postgres:
    image: postgres:15-alpine
    container_name: stk_classifier_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stk_admin
      POSTGRES_PASSWORD: stk_secure_pass
      POSTGRES_DB: stk_classifier_db
    ports:
      - "5432:5432"
    volumes:
      - stk_pgdata:/var/lib/postgresql/data
    networks:
      - stk-net

networks:
  stk-net:
    driver: bridge

volumes:
  stk_pgdata: